name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore GamePatchDepot.slnx --locked-mode

      - name: Build
        run: dotnet build GamePatchDepot.slnx --configuration Release --no-restore

      - name: Install verified HDiffPatch tools
        shell: pwsh
        run: ./setup-patch-tools.ps1

      - name: Test
        run: dotnet test GamePatchDepot.slnx --configuration Release --no-build
