name: Artifact retention

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/artifact-retention.yml

permissions:
  actions: write

concurrency:
  group: artifact-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete artifacts older than three days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RETENTION_DAYS: '3'
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          artifact_ids="${RUNNER_TEMP}/expired-artifact-ids"

          # Finish pagination before deleting, so page contents cannot shift underneath us.
          gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((.created_at | fromdateiso8601) < ${cutoff}) | .id" \
            > "$artifact_ids"

          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            printf 'Deleting expired artifact %s\n' "$artifact_id"
            gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}"
          done < "$artifact_ids"
